y,z);o.scale.set(sx||1,sy||1,sz||1);return o}
// 海面、沙滩和覆草小岛
var sea=mesh(new T.CircleGeometry(200,64),mat(0x60bbc5,.35),0,-1.15,0);sea.rotation.x=-Math.PI/2;sea.castShadow=false;var base=mesh(new T.CylinderGeometry(5.65,5.1,1.2,64),sand,0,-.45,0);base.scale.z=.9;var shore=mesh(new T.CylinderGeometry(5.45,5.55,.14,64),mat(0xf6dfaa),0,-.03,0);shore.scale.z=.9;var turf=mesh(new T.CylinderGeometry(5,5.25,.32,64),grass,0,.16,0);turf.scale.z=.9;

// 今日渔获
box(1.25,.12,.55,pale,-1.85,.56,.1);for(var f=0;f<3;f++){ball(.23,f===1?coral:blue,-2.18+f*.34,.78,.12,.95,.55,.42);var tail=mesh(new T.ConeGeometry(.14,.22,3),f===1?coral:blue,-2.18+f*.34,.78,-.13);tail.rotation.x=Math.PI/2;ball(.035,mat(0x173d49),-2.27+f*.34,.81,.28)}
// 椰子树
function palm(x,z,h,lean){var t=cyl(.13,.22,h,wood,x,h/2+.25,z,10);t.rotation.z=lean;var y=h+.25,xx=x+lean*h*.35;ball(.28,leaf,xx,y,z,1,.72,1);for(var a=0;a<7;a++){var q=a*Math.PI*2/7,fr=mesh(new T.ConeGeometry(.16,1.65,5),leaf,xx+Math.cos(q)*.67,y-.1,z+Math.sin(q)*.67);fr.rotation.z=-Math.cos(q)*.78;fr.rotation.x=Math.sin(q)*.8;fr.rotation.y=-q;ball(.12,mat(0x745238),xx+Math.cos(q)*.26,y-.24,z+Math.sin(q)*.26)}}palm(-3.25,-2.2,2.7,-.22);palm(3.25,-2.25,2.45,.18);palm(-3.6,1.85,2.15,.1);
// 海边小渔船

for(var r=0;r<11;r++){var a=r*2.4,rad=4.15+(r%3)*.18;ball(.28+(r%3)*.06,mat(r%2?0xc3ad82:0xd0bb91),Math.cos(a)*rad,.3,Math.sin(a)*rad,1,.68,.85)}for(var b=0;b<13;b++){var an=b*2.399,rr=3.05+(b%4)*.28,px=Math.cos(an)*rr,pz=Math.sin(an)*rr;if(Math.abs(px)<1.55&&pz<1.1&&pz>-.9)continue;ball(.26,leaf,px,.48,pz,1.2,.8,1);for(var k=0;k<3;k++)ball(.07,mat(k===1?0xffd77d:0xffaaa0),px+(k-1)*.13,.7,pz+.08)}for(var p=0;p<5;p++){var dot=cyl(.18,.18,.035,mat(0xe7c98d),-.15,.36,2.35+p*.43,18);dot.scale.set(1,.65,1)}
// 远处软绵绵的云
var cm=new T.MeshStandardMaterial({color:0xffffff,roughness:1});[[-6,5,-8],[4,6,-9],[7,4,-5]].forEach(function(v){ball(.72,cm,v[0],v[1],v[2],1.6,.65,.7);ball(.55,cm,v[0]+.65,v[1]+.12,v[2],1.3,.7,.75);ball(.48,cm,v[0]-.64,v[1]-.02,v[2],1.3,.7,.75)});
var target=new T.Vector3(0,.85,0),radius=15,az=.55,pol=1.1;function place(){camera.position.set(radius*Math.sin(pol)*Math.sin(az),radius*Math.cos(pol),radius*Math.sin(pol)*Math.cos(az));camera.lookAt(target)}function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener("resize",resize,{passive:true});resize();place();var pts=new Map(),pinch=0,lx=0,ly=0;c.addEventListener("pointerdown",function(e){c.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){lx=e.clientX;ly=e.clientY}if(pts.size===2){var q=Array.from(pts.values());pinch=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)}});c.addEventListener("pointermove",function(e){if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1){az-=(e.clientX-lx)*.006;pol=Math.max(.55,Math.min(1.42,pol+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY}else if(pts.size===2){var q=Array.from(pts.values()),d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(pinch)radius=Math.max(9,Math.min(22,radius-(d-pinch)*.025));pinch=d}});function up(e){pts.delete(e.pointerId);if(pts.size===1){var v=Array.from(pts.values())[0];lx=v.x;ly=v.y}if(pts.size<2)pinch=0}c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);c.addEventListener("wheel",function(e){radius=Math.max(9,Math.min(22,radius+e.deltaY*.012))},{passive:true});var clock=new T.Clock();function animate(){requestAnimationFrame(animate);boat.position.y=.03+Math.sin(clock.getElapsedTime()*1.3)*.035;renderer.render(scene,camera)}animate();status.textContent=""}catch(e){status.textContent="3D 场景启动失败，请刷新页面重试。";fallback.classList.add("show")}}load(0)})();
